status_definitions:
  PASS: "Independently completes recognition, application and verification under the declared test context"
  PARTIAL: "Understands the main idea but needs prompts, exceeds the time limit or remains error-prone"
  REVISIT: "Concept, recognition, retrieval or application is unstable in the declared context"
  NOT_STARTED: "No valid evidence exists for this context"
context_definitions:
  open_book: "Uses the declared version of allowed notes; records retrieval time and material version"
  closed_book: "Uses no notes; evaluates recall and internalized application"
update_rules:
  - "Every evidence item must declare open_book or closed_book."
  - "Open-book and closed-book status must never be overwritten as one unconditional PASS."
  - "Importing materials or hearing an explanation does not change mastery."
  - "A status change requires a linked test, response or verified user performance record."
  - "When migrating schema v1, retain the old value in migration_legacy_status until new contextual evidence exists."
